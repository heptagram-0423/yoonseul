<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>윤슬세탁소 1장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Pen+Script&display=swap">
<style>
:root{
  --ground:#E7ECEA; --surface:#FBFAF5; --surface-2:#F1F2EE; --ink:#1D2B2F; --muted:#5A6A6D; --line:#CBD3D1;
  --accent:#C8436A; --accent-ink:#FFFFFF; --accent-soft:#F6DCE4;
  --tag:#F0D57E; --tag-ink:#3A2F12; --tag-edge:#D8B955;
  --ruled:#C9D6E2; --paper:#FFFEF8; --good:#2F7D5B; --box:rgba(251,250,245,.985);
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-hand:"Nanum Pen Script","Gowun Batang",cursive;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#11181A; --surface:#1A2326; --surface-2:#212C2F; --ink:#E6EDEB; --muted:#98A8AA; --line:#344447;
    --accent:#EE7E9C; --accent-ink:#1A1014; --accent-soft:#3A2230;
    --tag:#CDB05A; --tag-ink:#231C07; --tag-edge:#A88E3F;
    --ruled:#34485A; --paper:#20292C; --good:#6CC49A; --box:rgba(26,35,38,.985);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#11181A; --surface:#1A2326; --surface-2:#212C2F; --ink:#E6EDEB; --muted:#98A8AA; --line:#344447;
  --accent:#EE7E9C; --accent-ink:#1A1014; --accent-soft:#3A2230;
  --tag:#CDB05A; --tag-ink:#231C07; --tag-edge:#A88E3F;
  --ruled:#34485A; --paper:#20292C; --good:#6CC49A; --box:rgba(26,35,38,.985);
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;padding-inline:16px;overflow:hidden}
.app{max-width:960px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-block:12px}
header{display:flex;align-items:center;gap:10px;padding-block:0 10px;flex-wrap:wrap}
.chap{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.chap-tag{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;background:var(--accent);color:var(--accent-ink);padding:3px 8px 3px 14px;border-radius:3px;position:relative;white-space:nowrap}
.chap-tag::before{content:"";position:absolute;left:5px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--ground)}
.chap .t{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.chap h1{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;white-space:nowrap}
.chap .sc{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-actions{display:flex;gap:8px}
.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.opt:focus-visible,.spot:focus-visible,.chip:focus-visible,.inv-item:focus-visible,.tabbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default}
.count{font-family:var(--f-mono);font-size:12px;background:var(--tag);color:var(--tag-ink);border-radius:4px;padding:0 6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}

/* scene */
.scene{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;background:#2a3336;cursor:pointer;user-select:none}
.bg{position:absolute;inset:0}
.bg svg{width:100%;height:100%;display:block}
.bg-fade{animation:bgin .5s ease-out}
@keyframes bgin{from{opacity:.2}to{opacity:1}}
.cast{position:absolute;inset:0;pointer-events:none;z-index:1}
.box,.choices,.panel{z-index:3}
.over{z-index:4}
.scene-chip,.toast{z-index:5}
.fig{position:absolute;bottom:0;transform:translateX(-50%);transition:filter .25s, transform .25s, left .35s}
.fig svg{height:100%;width:auto;display:block}
.fig.dim{filter:brightness(.62) saturate(.8)}
.fig.talk{transform:translateX(-50%) translateY(-6px)}
.fig.back{filter:brightness(.55) saturate(.6)}
.fig.enter{animation:figin .35s ease-out}
@keyframes figin{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1}}
.scene-chip{position:absolute;left:14px;top:14px;background:rgba(20,26,28,.72);color:#F3EFE4;font-family:var(--f-display);font-size:14px;padding:5px 12px;border-radius:6px;opacity:0;transition:opacity .4s}
.scene-chip.on{opacity:1}
.toast{position:absolute;right:14px;top:14px;background:var(--tag);color:var(--tag-ink);border:1px solid var(--tag-edge);font-size:13px;padding:5px 10px;border-radius:6px;opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .3s;pointer-events:none;max-width:70%}
.toast.on{opacity:1;transform:none}

.box{position:absolute;left:12px;right:12px;bottom:12px;max-width:820px;margin:0 auto;background:var(--box);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:22px 20px 16px;min-height:118px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.box .name{position:absolute;top:-14px;left:16px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;padding:3px 12px 3px 20px;border-radius:3px 12px 12px 3px}
.box .name::before{content:"";position:absolute;left:7px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--box)}
.box .name.mono{background:var(--ink);color:var(--surface)}
.box .txt{font-size:17px;line-height:1.75;max-width:62ch}
.box.narr .txt{font-family:var(--f-display);font-style:italic;color:var(--muted)}
.box.mono .txt{color:var(--muted)}
.box.sys .txt{font-family:var(--f-mono);font-size:13.5px;color:var(--muted)}
.box .more{position:absolute;right:16px;bottom:10px;color:var(--accent);font-size:13px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.box .more,.fig.enter,.bg-fade{animation:none}}

.choices{position:absolute;left:0;right:0;bottom:148px;display:flex;flex-direction:column;gap:8px;align-items:center;padding-inline:16px}
.opt{font:inherit;font-size:15.5px;width:min(520px,100%);text-align:left;border:1px solid var(--accent);background:var(--box);color:var(--ink);border-radius:10px;padding:11px 16px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.16)}
.opt:hover{background:var(--accent-soft)}

.panel{position:absolute;left:12px;right:12px;bottom:12px;max-width:820px;margin:0 auto;background:var(--box);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:default}
.panel h2{margin:0;font-family:var(--f-display);font-size:17px}
.hub{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.hub{grid-template-columns:repeat(2,minmax(0,1fr))}}
.spot{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;line-height:1.35}
.spot:hover{border-color:var(--accent)}
.spot .where{font-size:11.5px;color:var(--muted)}
.spot .what{font-weight:600;font-size:14.5px}
.spot .st{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.spot.done .st{color:var(--good)}
.hub-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.hub-foot .note{font-size:13px;color:var(--muted)}

/* overlays inside scene */
.over{position:absolute;inset:0;background:rgba(12,17,19,.55);display:flex;align-items:center;justify-content:center;padding:14px;cursor:default}
.over-in{background:var(--surface);color:var(--ink);border-radius:12px;width:100%;max-width:620px;max-height:100%;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.over-in .kicker{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--muted)}
.over-in .acts{display:flex;justify-content:flex-end;gap:8px}

.tag{position:relative;background:var(--tag);color:var(--tag-ink);border:1px solid var(--tag-edge);border-radius:4px 12px 12px 4px;padding:10px 14px 10px 32px}
.tag::before{content:"";position:absolute;left:11px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:1px solid var(--tag-edge)}
.tag .no{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;opacity:.8}
.tag .nm{font-weight:600;font-size:16px;line-height:1.4}
.tag .ds{font-size:14px;line-height:1.55}
.ledger{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 16px;font-family:var(--f-hand);font-size:25px;line-height:36px;background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--ruled) 35px 36px);background-position:0 9px;color:var(--ink)}
.ledger .red{color:var(--accent)}
.ledger .dim{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.letter{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:20px 20px 16px;font-family:var(--f-display);font-size:16px;line-height:1.9;display:flex;flex-direction:column;gap:10px}
.letter p{margin:0}
.letter .sign{align-self:flex-end;font-family:var(--f-hand);font-size:28px}
.diary{font-family:var(--f-hand);font-size:24px;line-height:1.5;background:var(--paper);border-left:3px solid var(--tag-edge);padding:12px 16px;border-radius:0 4px 4px 0}
.diary.locked{font-family:var(--f-body);font-size:14px;color:var(--muted);font-style:italic}
.note-cap{font-size:13.5px;color:var(--muted)}
.person{display:flex;gap:14px;align-items:center}
.person .pf{width:84px;height:110px;flex:none;background:var(--surface-2);border-radius:10px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.person .pf svg{height:100%;width:auto}
.person h3{margin:0;font-family:var(--f-display);font-size:18px}
.person p{margin:0;font-size:14.5px}

/* notebook */
.nb{display:flex;flex-direction:column;gap:14px}
.nb-sentence{font-family:var(--f-display);font-size:18px;line-height:2.1;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 16px}
.slot{display:inline-block;border-bottom:2px solid var(--accent);padding:0 6px;min-width:4.5em;text-align:center;color:var(--accent);font-weight:700}
.slot.ok{color:var(--good);border-color:var(--good)}
.blank{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.blank.ok{border-color:var(--good)}
.blank h3{margin:0;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.blank h3 .n{font-family:var(--f-mono);font-size:12px;background:var(--ink);color:var(--surface);border-radius:4px;padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.card[aria-pressed="true"]{background:var(--tag);color:var(--tag-ink);border-color:var(--tag-edge)}
.sub{font-size:12px;color:var(--muted)}
.fb{font-size:14px;border-radius:8px;padding:8px 10px;background:var(--accent-soft)}
.fb b{font-weight:600}
.fb.ok{background:transparent;color:var(--good);padding:0}
.acts-row{display:flex;gap:8px;flex-wrap:wrap}

/* sheets (inventory, backlog) */
.sheet{position:fixed;inset:0;background:rgba(10,16,18,.5);display:flex;justify-content:center;align-items:center;z-index:10;padding:16px}
.sheet-in{background:var(--surface);color:var(--ink);border-radius:14px;width:100%;max-width:640px;height:min(640px,100%);display:flex;flex-direction:column;overflow:hidden}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-family:var(--f-display);font-size:18px;flex:1}
.tabs{display:flex;gap:4px;padding:10px 16px 0;flex-wrap:wrap}
.tabbtn{font:inherit;font-size:14px;border:none;background:transparent;color:var(--muted);padding:6px 10px;border-radius:8px 8px 0 0;cursor:pointer;border-bottom:2px solid transparent}
.tabbtn[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.sheet-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.inv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:460px){.inv-grid{grid-template-columns:1fr}}
.inv-item{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;line-height:1.4}
.inv-item:hover{border-color:var(--accent)}
.inv-item .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.inv-item .n{font-weight:600}
.inv-item .d{font-size:13px;color:var(--muted)}
.inv-item.locked{opacity:.55;cursor:default}
.empty{color:var(--muted);font-size:14px}
.back-row{font-size:14.5px;line-height:1.6;display:flex;gap:10px}
.back-row .w{flex:none;width:5.5em;font-size:12.5px;font-weight:600;color:var(--accent);padding-top:2px}
.back-row .w.m{color:var(--muted)}
.back-row .x.narr{font-family:var(--f-display);font-style:italic;color:var(--muted)}
.back-row .x.sys{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.back-row.pick .x{color:var(--accent)}

.endcard{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.endcard .big{font-family:var(--f-display);font-size:26px;font-weight:700}
.big-tag{font-family:var(--f-mono);font-size:30px;letter-spacing:.12em;background:var(--tag);color:var(--tag-ink);border:1px solid var(--tag-edge);border-radius:4px 14px 14px 4px;padding:6px 20px 6px 38px;position:relative}
.big-tag::before{content:"";position:absolute;left:13px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:var(--surface);border:1px solid var(--tag-edge)}
.muted{color:var(--muted);font-size:14px}
/* v9: illustrated things */
.thing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.thing-tile{position:relative;aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:12px;cursor:pointer;padding:8px;background:radial-gradient(circle at 50% 45%,#FFFDF6 0,#EFE8D8 70%);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:transform .15s,box-shadow .15s}
.thing-tile svg{width:100%;height:100%}
.thing-tile:hover,.thing-tile:focus-visible{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.14);outline:none;border-color:var(--accent)}
.thing-cap{position:absolute;left:6px;right:6px;bottom:6px;font-size:12px;text-align:center;color:#3A3328;background:rgba(255,253,246,.92);border-radius:6px;padding:2px 4px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.thing-tile:hover .thing-cap,.thing-tile:focus-visible .thing-cap{opacity:1;transform:none}
.thing-view{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.thing-big{width:min(320px,100%);aspect-ratio:4/3;border-radius:14px;background:radial-gradient(circle at 50% 45%,#FFFDF6 0,#EFE8D8 72%);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:10px}
.thing-big svg{width:100%;height:100%}
.thing-view h3{margin:6px 0 0;font-family:var(--f-display);font-size:20px}
.thing-view p{margin:0;max-width:40ch;font-size:14.5px;color:var(--muted);line-height:1.6}
/* v8: deduction notebook */
.nb-btn{position:absolute;right:14px;bottom:14px;z-index:9;width:66px;height:76px;border:none;background:none;padding:0;cursor:pointer;transition:transform .16s ease-out,filter .16s ease-out;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.nb-btn svg{width:100%;height:100%;display:block}
.nb-btn:hover,.nb-btn:focus-visible{transform:translateY(-3px) rotate(-3deg) scale(1.05);filter:drop-shadow(0 8px 14px rgba(0,0,0,.35)) brightness(1.08)}
.nb-btn:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
.nb-dot{position:absolute;right:4px;top:4px;width:14px;height:14px;border-radius:50%;background:#C8436A;border:2px solid #FBF7EC;animation:nbpulse 1.6s ease-in-out infinite}
@keyframes nbpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.nbk{position:absolute;inset:0;z-index:6;background:rgba(14,19,20,.6);display:flex;align-items:center;justify-content:center;padding:14px;cursor:default;animation:dcin .25s ease-out}
.nbk-book{--paper:#FBF7EC;--rule:#CFDCE8;--nink:#24365A;--pencil:#6B6A66;--red:#C23A55;
  position:relative;width:min(940px,100%);max-height:100%;display:grid;grid-template-columns:1fr 22px 1fr;background:#7A5A3B;padding:12px;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 0 0 2px #5E4430;font-family:var(--f-hand);color:var(--nink)}
.nbk-page{background-color:var(--paper);background-image:linear-gradient(90deg,transparent 46px,#E9A3B0 46px,#E9A3B0 48px,transparent 48px),repeating-linear-gradient(to bottom,transparent 0 33px,var(--rule) 33px 34px);background-position:0 20px;padding:22px 22px 26px 60px;overflow-y:auto;max-height:calc(100vh - 120px);font-size:23px;line-height:34px;position:relative}
.nbk-page.left{border-radius:6px 2px 2px 6px;box-shadow:inset -14px 0 18px -14px rgba(0,0,0,.25)}
.nbk-page.right{border-radius:2px 6px 6px 2px;box-shadow:inset 14px 0 18px -14px rgba(0,0,0,.25)}
.nbk-spine{background-image:radial-gradient(circle at 50% 50%,#DCD6C6 0 4px,#9C9585 4px 5.5px,transparent 6px);background-size:22px 34px;background-position:center 20px;background-repeat:repeat-y;margin:0 -8px;position:relative;z-index:2}
.nbk-close{position:absolute;right:84px;top:-6px;z-index:3;font-family:var(--f-hand);font-size:22px;color:#fff;background:var(--red);border:none;padding:6px 14px 16px;cursor:pointer;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.nbk-close:focus-visible{outline:2px solid #fff;outline-offset:-4px}
.nbk-date{color:var(--pencil);font-size:20px}
.nbk-h{font-family:var(--f-hand);font-size:34px;line-height:34px;margin:0 0 6px;font-weight:400}
.nbk-sentence{font-size:27px;line-height:34px;margin:0 0 12px;padding:6px 10px;display:inline-block}
.nbk-sentence.solved{border:3px solid var(--red);border-radius:48% 52% 46% 54%/56% 44% 56% 44%;transform:rotate(-1.5deg)}
.nbk-blank{display:inline-block;min-width:3.4em;text-align:center;border-bottom:2px solid var(--nink);color:var(--pencil)}
.nbk-fill{color:var(--red);border-bottom:2px solid var(--red);padding:0 4px}
.nbk-sub{font-family:var(--f-hand);font-weight:400;font-size:25px;margin:6px 0 0;text-decoration:underline wavy #E9A3B0 2px;text-underline-offset:6px}
.nbk-cnt{font-size:19px;color:var(--pencil)}
.nbk-clues{margin:0;padding-left:20px;font-size:21px}
.nbk-clues b{font-weight:400;background:linear-gradient(transparent 55%,#F6E39A 55%)}
.nbk-page .dim{color:var(--pencil)}
.nbk-sticky{display:block;margin:16px 0 4px auto;max-width:250px;background:#FFE98A;border:none;box-shadow:0 4px 8px rgba(0,0,0,.18);transform:rotate(2.5deg);font-family:var(--f-hand);font-size:21px;line-height:1.3;color:#4A3A12;padding:12px 14px;text-align:left;cursor:pointer}
.nbk-sticky .who{display:block;font-size:17px;color:#8A6A12}
.nbk-sticky:focus-visible{outline:2px solid var(--red)}
.nbk-q{padding:2px 0 12px;border-bottom:1px dashed #D9CFB8;margin-bottom:10px}

function washerRun(){

  if(S.phase==="d1_wash"&&S.washed&&!S.ironed) return [

function filterRun(){
  if(S.phase==="d2_invest"){
    if(S.got.has("filter")) return [M("플라스틱 단추 하나뿐이었지.")];
    return [
      N("세탁기 문 아래 필터를 돌려 연다. 실보풀, 동전 하나, 흰 플라스틱 단추 하나."),

      CARD("filter")];

  if(S.washed&&!S.filterSeen) return [N("필터를 열어 본다. 실보풀, 동전 하나, 흰 플라스틱 단추 하나."),M("다른 손님 거겠지. 저고리 단추는 아니네."),DO(()=>{S.filterSeen=true;})];

function enterHook(loc){
  if(loc==="counter"&&S.phase==="d1_street") return [DO(()=>{S.phase="d1_open";}),N("셔터를 올린 가게 안은 아직 컴컴하다. 바깥 빛이 유리문으로 조금 들어올 뿐."),M("스위치가 출입문 옆에 있었지.")];
  if(loc==="counter"&&S.phase==="d2_street") return [DO(()=>{S.phase="d2_open";}),M("불부터 켜자.")];
  if(loc==="auntroom"&&!S.auntIn) return [
    DO(()=>{S.auntIn=true;}),
    N("문고리를 돌린다. 이모 방은 석 달 전 그대로다."),
    M("섬유유연제랑 다리미 열기 냄새. 이모 냄새다.")];
  if(loc==="storage"&&!S.storageSeen) return [
    DO(()=>{S.storageSeen=true;}),
    N("창고 문을 연다. '손대지 말 것' 종이가 팔랑인다."),
    N("안은 캄캄하다. 휴대폰 손전등을 켠다."),
    M("시장님까지 창고 얘기를 하시네. 정리는 못 해도, 뭐가 있는지는 알아야지.")];
  return [];
}

  const toPt=e=>{const c=svg.getScreenCTM(); if(!c)return mini.pos; const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(c.inverse()); return {x:Math.max(40,Math.min(760,q.x)),y:Math.max(60,Math.min(440,q.y))};};

  svg.addEventListener("pointermove",e=>{ if(mini)mini.pos=toPt(e); });
  const up=()=>{ if(mini)mini.press=false; };
  svg.addEventListener("pointerup",up); svg.addEventListener("pointercancel",up);
  svg.addEventListener("click",e=>e.stopPropagation());
  setTimeout(()=>svg.focus({preventScroll:true}),50);
  const collarD=p=>{ const seg=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((p.x-a[0])*dx+(p.y-a[1])*dy)/(dx*dx+dy*dy)));return Math.hypot(p.x-a[0]-t*dx,p.y-a[1]-t*dy);}; return Math.min(seg([345,163],[400,250]),seg([400,250],[455,163])); };

    if(!mini||mini.kind!=="iron")return;

    const fill=$("iron-fill"); if(fill)fill.style.width=Math.round(prog*100)+"%";

}
function miniKey(e){
  if(!mini)return false;
  if(mini.kind==="keypad"){
    if(e.type!=="keydown")return false;
    if(/^[0-9]$/.test(e.key)){ kpPress(e.key); e.preventDefault(); return true; }
    if(e.key==="Backspace"){ kpPress("*"); e.preventDefault(); return true; }
    if(e.key==="Enter"){ kpPress("#"); e.preventDefault(); return true; }
    return false;
  }
  if(mini.kind==="shutter"){ if(e.type==="keydown"&&(e.key===" "||e.key==="Enter")){ e.preventDefault(); if(!e.repeat)shutterTap(); return true; } return false; }
  const step=22, k=e.key;
  if(e.type==="keydown"){
    if(k==="ArrowLeft")mini.pos.x=Math.max(40,mini.pos.x-step); else if(k==="ArrowRight")mini.pos.x=Math.min(760,mini.pos.x+step);
    else if(k==="ArrowUp")mini.pos.y=Math.max(60,mini.pos.y-step); else if(k==="ArrowDown")mini.pos.y=Math.min(440,mini.pos.y+step);
    else if(k===" "){ mini.press=true; } else return false;
    e.preventDefault(); return true;
  }
  if(e.type==="keyup"&&k===" "){ mini.press=false; e.preventDefault(); return true; }
  return false;
}

/* ---------- notebook ---------- */
const BLANKS=[
  {n:"①",q:"언제 없어졌나",opts:["세탁하는 중","세탁소에 맡기기 전","찾아간 뒤"],ans:1,cards:["ledger","filter"],wrong:{
    0:["봉순","그럼 그 세탁기 통 안에 있어야 할 거 아니냐?"],
    2:["봉순","찾아오자마자 풀어 봤다니까! 도윤이가 들고 오는 동안 어디 갔겠냐?"]}},
  {n:"②",q:"누가 가져갔나",opts:["서하","도윤이","봉순 할머니"],ans:1,cards:["marble","ledger"],wrong:{
    0:["서하","나는 받아서 빨고 다렸을 뿐이야. 장부에도 처음부터 다섯 개라고 적어 뒀고."],
    2:["봉순","내가 미쳤냐, 영감 단추를!"]}},
  {n:"③",q:"왜 가져갔나",opts:["단추가 떨어질 것 같아서","구슬치기 왕구슬로 쓰려고","할머니를 골탕 먹이려고"],ans:1,cards:["marble","thread","glass"],wrong:{
    0:["서하","그랬다면 할머니한테 드렸겠지. 주머니에, 그것도 구슬 사이에 넣어 두진 않았을 거야."],
    2:["서하","도윤이 표정은 장난친 얼굴이 아니었어. 뭔가 갖고 싶었던 얼굴이지."]}}
];
const HINTS=["옷보다 먼저 장부를 봐라. 장부는 거짓말을 안 한다.","맡길 때 몇 개였는지 네가 직접 적어 놨잖니.","애들 주머니에는 그 애가 제일 아끼는 게 들어 있단다."];
function nbInit(){ if(!nb) nb=BLANKS.map(()=>({opt:null,card:null,ok:false,fb:null})); }
function updateNbBtn(){
  const b=$("btn-nb"); const show=!!(S&&S.phase==="d2_invest"&&mode==="explore");
  b.hidden=!show;
  const solved=nb&&nb.every(s=>s.ok);
  $("nb-dot").hidden=!(show&&coreCount()>=4&&!solved);
}
function openNotebook(){
  if(!S||S.phase!=="d2_invest")return;
  leaveExplore(); mode="note"; nbInit(); hintShown=false;
  $("nbk").hidden=false; drawNotebook();
  const c=$("nbk-close"); if(c)c.focus({preventScroll:true});
}
function closeNotebook(){ $("nbk").hidden=true; $("nbk").innerHTML=""; enterExplore(lastLoc); }
let hintShown=false;
function drawNotebook(){
  const root=$("nbk");
  const pr=root.querySelector(".nbk-page.right"), keep=pr?pr.scrollTop:0;
  const cards=CORE.concat(["glass"]).filter(k=>S.got.has(k));
  const all=nb.every(s=>s.ok);
  const blank=i=>nb[i].ok?`<span class="nbk-fill">${esc(BLANKS[i].opts[BLANKS[i].ans])}</span>`:`<span class="nbk-blank">${BLANKS[i].n}</span>`;
  const left=`<div class="nbk-date">11월 10일 (화)</div>
    <h2 class="nbk-h">사건 · 사라진 단추</h2>
    <p class="nbk-sentence${all?" solved":""}">단추는 ${blank(0)}에 이미 없었다.<br>가져간 사람은 ${blank(1)},<br>이유는 ${blank(2)}.</p>
    <h3 class="nbk-sub">모은 단서 <span class="nbk-cnt">${Math.min(4,coreCount())}/4${S.got.has("glass")?" +1":""}</span></h3>
    <ul class="nbk-clues">${cards.map(k=>`<li><b>${esc(cardOf(k).nm)}</b> ${esc(cardOf(k).ds)}</li>`).join("")}${coreCount()<4?`<li class="dim">……아직 더 있을 것 같다.</li>`:""}</ul>
    <button class="nbk-sticky" type="button" id="nbk-hint">${hintShown?`<span class="who">이모라면</span>${esc(HINTS[(hintIdx-1+HINTS.length)%HINTS.length])}`:`<span class="who">막힐 땐</span>이모라면 뭐라고 했을까?`}</button>`;
  const right=all?`<div class="nbk-done"><span class="nbk-bigstamp">해결</span><p>할머니랑 도윤이를 불러서<br>차근차근 이야기하자.</p><button class="nbk-go" type="button" id="nbk-go">해결하러 가기 →</button></div>`
    :BLANKS.map((b,i)=>{ const s=nb[i];
      if(s.ok) return `<div class="nbk-q ok"><span class="nbk-num">${b.n}</span>${esc(b.q)}? <span class="nbk-tick">${esc(b.opts[b.ans])} — ${esc(cardOf(s.card).nm)}</span></div>`;
      return `<div class="nbk-q"><div class="nbk-qh"><span class="nbk-num">${b.n}</span>${esc(b.q)}?</div>
        <div class="nbk-words">${b.opts.map((o,j)=>`<button class="nbk-word" type="button" data-q="${i}" data-o="${j}" aria-pressed="${s.opt===j}">${esc(o)}</button>`).join("")}</div>
        <div class="nbk-why">근거로 붙일 단서</div>
        <div class="nbk-tags">${cards.length?cards.map(k=>`<button class="nbk-tag" type="button" data-q="${i}" data-c="${k}" aria-pressed="${s.card===k}">${esc(cardOf(k).nm)}</button>`).join(""):`<span class="dim">아직 붙일 단서가 없다.</span>`}</div>
        <div class="nbk-row"><button class="nbk-stamp" type="button" data-ok="${i}"${s.opt===null||s.card===null?" disabled":""}>확인</button>${s.fb?`<span class="nbk-fb">${s.fb}</span>`:""}</div></div>`; }).join("");
  root.innerHTML=`<div class="nbk-book" role="dialog" aria-modal="true" aria-label="추리 수첩">
    <button class="nbk-close" type="button" id="nbk-close">덮기</button>
    <div class="nbk-page left">${left}</div><div class="nbk-spine" aria-hidden="true"></div><div class="nbk-page right">${right}</div></div>`;
  const npr=root.querySelector(".nbk-page.right"); if(npr)npr.scrollTop=keep;
  root.querySelectorAll(".nbk-word").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();const s=nb[+b.dataset.q];s.opt=+b.dataset.o;s.fb=null;drawNotebook();}));
  root.querySelectorAll(".nbk-tag").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();const s=nb[+b.dataset.q];s.card=b.dataset.c;s.fb=null;drawNotebook();}));
  root.querySelectorAll("[data-ok]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();check(+b.dataset.ok);}));
  $("nbk-hint").addEventListener("click",e=>{e.stopPropagation();hintIdx++;hintShown=true;drawNotebook();});
  $("nbk-close").addEventListener("click",e=>{e.stopPropagation();closeNotebook();});
  const go=$("nbk-go"); if(go)go.addEventListener("click",e=>{e.stopPropagation();$("nbk").hidden=true;$("nbk").innerHTML="";S.phase="d2_resolve";queue=resolveSteps();mode="line";run();});
}
function check(i){
  const b=BLANKS[i],s=nb[i];
  if(s.opt!==b.ans){ const w=b.wrong[s.opt]; s.fb=`<b>${esc(w[0])}:</b> ${esc(w[1])}`; }
  else if(!b.cards.includes(s.card)){ s.fb=`답은 맞는 것 같은데, '${esc(cardOf(s.card).nm)}'로는 설명이 안 돼. 다른 단서를 붙여 보자.`; }
  else { s.ok=true; s.fb=null; }
  drawNotebook();
}

/* ---------- inventory ---------- */
let invTab="clue";
function invTabs(){
  const t=[["clue","단서"],["memo","메모"],["thing","물건"]];
  if(S.inv.some(id=>ITEMS[id]&&ITEMS[id].cat==="diary"))t.push(["diary","이모의 수첩"]);
  t.push(["people","인물"]); return t;
}
function openInv(tab){ if(!S)return; invTab=tab||invTab; newItems=false; updateCount(); $("sheet-inv").hidden=false; drawInv(); $("inv-close").focus(); }
function daySection(day,inner,count){
  const open=day===S.day;
  return `<details class="day"${open?" open":""}><summary><span>${esc(day+"일째 · "+(DATES[day]||""))}</span><span class="day-n">${count}</span></summary><div class="day-body">${inner}</div></details>`;
}
function drawInv(){
  const tabs=$("inv-tabs"); tabs.innerHTML="";
  const list=invTabs(); if(!list.some(t=>t[0]===invTab))invTab="clue";
  list.forEach(([k,label])=>{ const b=document.createElement("button"); b.type="button"; b.className="tabbtn"; b.setAttribute("role","tab"); b.setAttribute("aria-selected",invTab===k); b.textContent=label;
    b.addEventListener("click",()=>{invTab=k;drawInv();}); tabs.appendChild(b); });
  const body=$("inv-body"); body.innerHTML="";
  if(invTab==="clue"){
    const ks=CORE.concat(["glass"]).filter(k=>S.got.has(k));
    if(!ks.length){body.innerHTML=`<p class="empty">아직 모은 단서가 없다.</p>`;return;}
    const byDay={}; ks.forEach(k=>{const d=S.cardDay[k]||1;(byDay[d]=byDay[d]||[]).push(k);});
    Object.keys(byDay).sort((a,b)=>b-a).forEach(d=>body.insertAdjacentHTML("beforeend",daySection(+d,`<div class="card-stack">${byDay[d].map(k=>tagHTML(cardOf(k))).join("")}</div>`,byDay[d].length+"장")));
    return;
  }
  const items=S.inv.filter(id=>ITEMS[id]&&ITEMS[id].cat===invTab);
  const empty={people:"아직 만난 사람이 없다.",memo:"아직 적어 둔 메모가 없다.",thing:"아직 챙긴 물건이 없다.",diary:"아직 수첩이 없다."};
  if(!items.length){body.innerHTML=`<p class="empty">${empty[invTab]}</p>`;return;}
  const cell=id=>{const it=ITEMS[id];return `<button type="button" class="inv-item" data-item="${id}"><span class="k">${esc(it.k)}</span><span class="n">${esc(it.n)}</span><span class="d">${esc(it.d)}</span></button>`;};
  if(invTab==="people"){ body.insertAdjacentHTML("beforeend",`<div class="inv-grid">${items.map(cell).join("")}</div>`); }
  else if(invTab==="thing"){
    const tile=id=>{const it=ITEMS[id];return `<button type="button" class="thing-tile" data-item="${id}" aria-label="${esc(it.n)}" title="${esc(it.n)}">${it.art?it.art():""}<span class="thing-cap">${esc(it.n)}</span></button>`;};
    const byDay={}; items.forEach(id=>{const d=S.itemDay[id]||1;(byDay[d]=byDay[d]||[]).push(id);});
    Object.keys(byDay).sort((a,b)=>b-a).forEach(d=>body.insertAdjacentHTML("beforeend",daySection(+d,`<div class="thing-grid">${byDay[d].map(tile).join("")}</div>`,byDay[d].length+"개")));
  }
  else{
    const byDay={}; items.forEach(id=>{const d=S.itemDay[id]||1;(byDay[d]=byDay[d]||[]).push(id);});
    Object.keys(byDay).sort((a,b)=>b-a).forEach(d=>body.insertAdjacentHTML("beforeend",daySection(+d,`<div class="inv-grid">${byDay[d].map(cell).join("")}</div>`,byDay[d].length+"개")));
  }
  body.querySelectorAll("[data-item]").forEach(b=>b.addEventListener("click",()=>viewItem(b.dataset.item)));
}
function viewItem(id){
  const it=ITEMS[id]; const body=$("inv-body");
  body.innerHTML=it.art?`<div class="thing-view"><div class="thing-big">${it.art()}</div><h3>${esc(it.n)}</h3><p>${esc(it.note?it.note():it.d)}</p></div>`:`<span style="font-family:var(--f-mono);font-size:11.5px;color:var(--muted)">${esc(it.k)} · ${esc(it.n)}</span>${it.html()}`;
  const back=document.createElement("button"); back.type="button"; back.className="btn"; back.textContent="◂ 목록으로"; back.style.alignSelf="flex-start";
  back.addEventListener("click",drawInv); body.appendChild(back); body.scrollTop=0;
}
$("inv-close").addEventListener("click",()=>{$("sheet-inv").hidden=true;});
$("sheet-inv").addEventListener("click",e=>{if(e.target.id==="sheet-inv")$("sheet-inv").hidden=true;});

/* ---------- backlog ---------- */
function openLog(){
  if(!history)return;
  const b=$("log-body"); b.innerHTML="";
  history.forEach(h=>{
    if(h.kind==="scene"){b.insertAdjacentHTML("beforeend",`<div class="back-row"><span class="w m">장면</span><span class="x" style="font-family:var(--f-display);font-weight:700">${esc(h.x)}</span></div>`);return;}
    const w=h.kind==="say"?h.who:h.kind==="pick"?"선택":"";
    b.insertAdjacentHTML("beforeend",`<div class="back-row${h.kind==="pick"?" pick":""}"><span class="w${h.kind==="say"?"":" m"}">${esc(w)}</span><span class="x ${h.kind}">${esc(h.x)}</span></div>`);
  });
  $("sheet-log").hidden=false; requestAnimationFrame(()=>{b.scrollTop=b.scrollHeight;}); $("log-close").focus();
}
$("log-close").addEventListener("click",()=>{$("sheet-log").hidden=true;});
$("sheet-log").addEventListener("click",e=>{if(e.target.id==="sheet-log")$("sheet-log").hidden=true;});

/* ---------- input ---------- */
$("mini").addEventListener("pointerdown",e=>{ if(mode!=="mini"||!mini||mini.kind!=="shutter")return; e.stopPropagation(); shutterTap(); });
$("mini").addEventListener("click",e=>e.stopPropagation());
document.addEventListener("keyup",e=>{ if(mode==="mini")miniKey(e); });
$("scene").addEventListener("click",e=>{ if(mode==="explore"||mode==="mini")return; if(e.target.closest("button")||e.target.closest(".over-in")||e.target.closest(".menu-panel"))return; advance(); });
document.addEventListener("keydown",e=>{
  if(mode==="mini"&&$("lobby").hidden&&$("sheet-inv").hidden&&$("sheet-log").hidden&&miniKey(e))return;
  if(e.key==="Escape"){ if(!$("sheet-inv").hidden||!$("sheet-log").hidden){ $("sheet-inv").hidden=true; $("sheet-log").hidden=true; return; } if(!$("nbk").hidden&&mode==="note"){ closeNotebook(); return; } closeMenuPanel(); return; }
  if(!$("sheet-inv").hidden||!$("sheet-log").hidden||!$("lobby").hidden||!$("menu-panel").hidden)return;
  if(e.target.closest&&(e.target.closest("button")||e.target.closest(".spot")))return;
  if(e.key==="Enter"||e.key===" "){ e.preventDefault(); advance(); }
});

/* ---------- save / load (this browser only) ---------- */
const SAVE_KEY="yunseul-save-v2", SET_KEY="yunseul-settings-v1";
const SPEEDS={slow:{step:1,ms:45},normal:{step:2,ms:28},fast:{step:4,ms:18},instant:{step:0,ms:0}};
let speed="normal", running=false;
try{ const st=JSON.parse(localStorage.getItem(SET_KEY)||"{}"); if(SPEEDS[st.speed])speed=st.speed; }catch(e){}
function saveSettings(){ try{localStorage.setItem(SET_KEY,JSON.stringify({speed}));}catch(e){} }
function saveGame(cp){
  if(!S)return;
  const data={cp,loc:curLoc,S:{...S,got:[...S.got]},nb,tag:$("ch-tag").textContent,title:$("ch-title").textContent,when:Date.now()};
  try{ localStorage.setItem(SAVE_KEY,JSON.stringify(data)); }catch(e){}
}
function readSave(){ try{ const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null"); return d&&d.S?d:null; }catch(e){ return null; } }
function freshRuntime(){
  closeDoc(); closeMenuPanel(); $("nbk").hidden=true; $("nbk").innerHTML=""; queue=[]; history=[]; emo={}; cast=[]; curBg=null; curLoc=null; lastLoc="counter"; hintIdx=0; nb=null; newItems=false; mode="line"; fit="slice";
  leaveExplore(); setTint(""); $("choices").hidden=true; $("daycard").hidden=true; $("box").hidden=false;
  clearMini(); $("fx").innerHTML="";
}
function start(){
  freshRuntime(); resetState();
  queue=openingSteps(); running=true; updateCount(); run();
}
function continueGame(){
  const d=readSave(); if(!d){ start(); return; }
  freshRuntime(); resetState();
  Object.assign(S,d.S,{got:new Set(d.S.got)});
  nb=d.nb||null; $("ch-tag").textContent=d.tag||"CH.01"; $("ch-title").textContent=d.title||"사라진 단추";
  running=true; updateCount();
  if(d.cp==="day"){ S.day=S.day||1; queue=morningSteps(S.day); run(); }
  else enterExplore(LOCS[d.loc]?d.loc:"street");
}

/* ---------- lobby ---------- */
function openLobby(){ drawLobby(); $("lobby").hidden=false; const f=$("lobby").querySelector(".lb-item:not([disabled])"); if(f)f.focus({preventScroll:true}); }
function closeLobby(){ $("lobby").hidden=true; }
function drawLobby(view){
  const m=$("lb-menu"), save=readSave();
  if(view==="confirm"){
    m.innerHTML=`<p class="lb-note">지금까지 진행한 내용이 사라집니다.<br>처음부터 다시 할까요?</p><button class="lb-item" type="button" data-act="new-yes">처음부터 다시 하기</button><button class="lb-item" type="button" data-act="back">돌아가기</button>`;
  } else if(view==="settings"){
    m.innerHTML=`<p class="lb-note">글자 나오는 속도</p><div class="lb-speed">${[["slow","느리게"],["normal","보통"],["fast","빠르게"],["instant","바로"]].map(([k,l])=>`<button type="button" class="lb-chip" data-speed="${k}" aria-pressed="${speed===k}">${l}</button>`).join("")}</div><p class="lb-note small">진행 상황은 이 브라우저에만 저장됩니다. 장소를 옮기거나 하루가 바뀔 때 자동 저장돼요.</p><button class="lb-item" type="button" data-act="back">돌아가기</button>`;
  } else {
    const where=save?`${save.S.day||1}일째 · ${save.cp==="day"?"아침":(LOCNAME[save.loc]||"조사")}`:"";
    const cont=running?`<button class="lb-item" type="button" data-act="resume">계속하기</button>`:`<button class="lb-item" type="button" data-act="continue"${save?"":" disabled"}>이어서${save?`<span class="lb-sub">${esc(where)}</span>`:""}</button>`;
    m.innerHTML=`<button class="lb-item" type="button" data-act="new">처음부터</button>${cont}<button class="lb-item" type="button" data-act="settings">게임 설정</button>`;
  }
  m.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>{
    const a=b.dataset.act;
    if(a==="new"){ if(running||readSave())drawLobby("confirm"); else { closeLobby(); start(); } }
    else if(a==="new-yes"){ try{localStorage.removeItem(SAVE_KEY);}catch(e){} closeLobby(); start(); }
    else if(a==="continue"){ closeLobby(); continueGame(); }
    else if(a==="resume"){ closeLobby(); }
    else if(a==="settings"){ drawLobby("settings"); }
    else if(a==="back"){ drawLobby(); }
  }));
  m.querySelectorAll("[data-speed]").forEach(b=>b.addEventListener("click",()=>{ speed=b.dataset.speed; saveSettings(); drawLobby("settings"); }));
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("lobby").hidden&&running){ closeLobby(); } },true);

$("lb-art").innerHTML=LOBBY_ART;
openLobby();
})();
</script>
